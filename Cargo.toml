[package]
name = "strauss"
version = "0.1.0"
edition = "2021"
description = "High-performance PHP namespace prefixer - Rust rewrite of BrianHenryIE/strauss"
license = "MIT"

[[bin]]
name = "strauss"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.24"
tree-sitter-php = "0.23"
regex = "1"
fancy-regex = "0.14"
aho-corasick = "1"
rayon = "1"
walkdir = "2"
dashmap = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
globset = "0.4"
once_cell = "1"
md5 = "0.7"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
